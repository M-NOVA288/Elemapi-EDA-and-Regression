name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  slo-analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 02-slo-log-analyzer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest -v
      - name: Report on sample data (smoke test)
        run: python -m slo_toolkit report data/sample_logs.jsonl
